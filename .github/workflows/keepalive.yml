name: Comprobar Beauty Business Dashboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Visitar dashboard
        run: |
          URL="https://beauty-business-dashboard.streamlit.app/"

          echo "Comprobando el dashboard..."

          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/dashboard.html \
            -w "%{http_code}" \
            --max-time 120 \
            "$URL")
          
          echo "Código HTTP: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "La petición ha recibido una respuesta HTTP."
          else
            echo "La petición no ha terminado correctamente."
            exit 1
          fi

          echo "Código HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "La página respondió correctamente."
          else
            echo "La página no respondió como se esperaba."
            exit 1
          fi
