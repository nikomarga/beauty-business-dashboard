```yaml
name: Comprobar Beauty Business Dashboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Diagnosticar respuesta del dashboard
        run: |
          URL="https://beauty-business-dashboard.streamlit.app/"

          echo "Consultando el dashboard..."

          curl -sS \
            --max-time 30 \
            --max-redirs 0 \
            -D /tmp/headers.txt \
            -o /tmp/dashboard.html \
            -w "\nCódigo HTTP: %{http_code}\nURL consultada: %{url_effective}\n" \
            "$URL"

          echo ""
          echo "Encabezados recibidos:"
          cat /tmp/headers.txt

          echo ""
          echo "Primeros 1000 caracteres de la respuesta:"
          head -c 1000 /tmp/dashboard.html || true

          echo ""
          echo "Fin del diagnóstico."
```
