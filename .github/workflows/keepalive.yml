
name: Comprobar Beauty Business Dashboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Comprobar acceso al dashboard
        run: |
          URL="https://beauty-business-dashboard.streamlit.app/"

          echo "Consultando dashboard como navegador..."

          curl -sS \
            --max-time 30 \
            --max-redirs 0 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142.0.0.0 Safari/537.36" \
            -D /tmp/headers.txt \
            -o /tmp/dashboard.html \
            -w "\nCódigo HTTP: %{http_code}\n" \
            "$URL"

          echo ""
          echo "Encabezados:"
          cat /tmp/headers.txt

          echo ""
          echo "Contenido recibido:"
          head -c 500 /tmp/dashboard.html
