name: Comprobar Beauty Business Dashboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Investigar respuesta del dashboard
        run: |
          URL="https://beauty-business-dashboard.streamlit.app/"

          echo "Consultando el dashboard..."

          curl -sS \
            -D /tmp/headers.txt \
            -o /tmp/dashboard.html \
            --max-time 120 \
            "$URL"

          echo "Encabezados de respuesta:"
          cat /tmp/headers.txt

          echo "Fin de la comprobación."
